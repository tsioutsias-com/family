<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Family Tree</title>
<link href="favicon.ico" rel="icon" type="image/x-icon"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: sans-serif;
  }
  body {
    background-image: url('sat_logo_faded.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    background-attachment: fixed;
  }
  .credit {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #9ddcff;
    font-size: 0.9em;
    font-style: italic;
    z-index: 1000;
    text-align: center;
    white-space: nowrap;
  }
  nav {
    background: #2e2e2e;
    padding: 1em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }
  nav a {
    margin-right: 1em;
    color: #9ddcff;
    text-decoration: none;
    font-weight: bold;
  }
  .toolbar {
    position: absolute;
    top: 64px;
    left: 0;
    right: 0;
    height: 70px;
    z-index: 10;
    background: rgba(10,10,12,.82);
    border-top: 1px solid rgba(255,255,255,.08);
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 8px 16px;
    box-sizing: border-box;
  }
  .toolbar strong { color:#f4efe6; }
  .toolbar span { color:#b9b2a7; font-size: .95em; }
  .zoom-buttons { display:flex; gap:8px; }
  button {
    border: 1px solid rgba(157,220,255,.45);
    background: rgba(157,220,255,.12);
    color: #fff;
    border-radius: 999px;
    padding: 7px 13px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: rgba(157,220,255,.25); }
  #treeWrapper {
    position: absolute;
    top: 134px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: auto;
    cursor: grab;
    user-select: none;
    background: rgba(0,0,0,.45);
  }
  #treeWrapper.dragging { cursor: grabbing; }
  #treeStage {
    transform-origin: top left;
    transition: transform .12s ease;
    padding: 30px;
    width: max-content;
    height: max-content;
  }
  #treeImage {
    display: block;
    width: 47838px;
    height: auto;
    max-width: none;
    border-radius: 12px;
    box-shadow: 0 18px 60px rgba(0,0,0,.55);
    border: 1px solid rgba(157,220,255,.24);
    pointer-events: none;
  }
  @media (max-width: 720px) {
    .credit { display:none; }
    .toolbar { top:58px; height:86px; }
    #treeWrapper { top:144px; }
    nav { justify-content:center; }
  }
</style>
</head>
<body>
<div class="credit">Το αρχικό σχεδιάστηκε από τον Γιώργο Κ. Κωνσταντόπουλο το Σεπτέμβρη του 1978.</div>
<nav>
  <div>
    <a href="index.html">Home</a>
    <a href="history.html">Family History</a>
  </div>
</nav>

<section class="toolbar">
  <strong>Full Family Tree</strong>
  <span>Use scroll bars, mouse drag/pan, or zoom controls to view the full image.</span>
  <div class="zoom-buttons">
    <button id="zoomOut">−</button>
    <button id="resetZoom">100%</button>
    <button id="zoomIn">+</button>
  </div>
</section>

<div id="treeWrapper">
  <div id="treeStage">
    <img id="treeImage" src="full-family-tree.svg" alt="Full family tree image">
  </div>
</div>

<script>
const wrapper = document.getElementById('treeWrapper');
const stage = document.getElementById('treeStage');
let zoom = 0.55;

function setZoom(value) {
  zoom = Math.max(0.25, Math.min(1.4, value));
  stage.style.transform = `scale(${zoom})`;
  document.getElementById('resetZoom').textContent = Math.round(zoom * 100) + '%';
}

document.getElementById('zoomIn').onclick = () => setZoom(zoom + 0.1);
document.getElementById('zoomOut').onclick = () => setZoom(zoom - 0.1);
document.getElementById('resetZoom').onclick = () => setZoom(0.55);

let dragging = false;
let startX = 0;
let startY = 0;
let startLeft = 0;
let startTop = 0;

wrapper.addEventListener('mousedown', (event) => {
  if (event.button !== 0) return;
  dragging = true;
  wrapper.classList.add('dragging');
  startX = event.clientX;
  startY = event.clientY;
  startLeft = wrapper.scrollLeft;
  startTop = wrapper.scrollTop;
  event.preventDefault();
});

window.addEventListener('mousemove', (event) => {
  if (!dragging) return;
  wrapper.scrollLeft = startLeft - (event.clientX - startX);
  wrapper.scrollTop = startTop - (event.clientY - startY);
});

window.addEventListener('mouseup', () => {
  dragging = false;
  wrapper.classList.remove('dragging');
});

setZoom(0.55);
window.addEventListener('load', () => {
  wrapper.scrollLeft = (stage.scrollWidth * zoom - wrapper.clientWidth) / 2;
});
</script>
</body>
</html>
